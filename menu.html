<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>menu</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h2>explore our menu categories</h2>
    <p>discover something delicious for every craving</p>

    <div id="gallery">
        <div class="photos">
            <img src="./images/breakfast.jpeg" alt="breakfast" style="width: 100%; height: 180px;" class="category-image">
            <a href="product.html?category=breakfast" class="category-link">breakfast</a>
        
        </div>

        <div class="photos">
            <img src="./images/meals.jpeg" alt="meals" style="width: 100%; height: 180px;" class="category-image">
            <a href="product.html?category=meals" class="category-link">meals</a>
        </div>

        <div class="photos">
            <img src="./images/cold drinks.jpeg" alt="cold-drinks" style="width: 100%; height: 180px;" class="category-image">
            <a href="product.html?category=cold-drinks" class="category-link">cold drinks</a>
        </div>

        <div class="photos">
            <img src="./images/hot drinks.jpeg" alt="hot drinks" style="width: 100%; height: 180px;" class="category-image">
            <a href="product.html?category=hot-drinks" class="category-link">hot drinks</a>
        </div>

        <div class="photos">
            <img src="./images/dessert photos.jpeg" alt="hot drinks" style="width: 150px; height: 190px; object-fit: cover;"
                class="category-image">
            <a href="product.html?category=desserts" class="category-link">desserts</a>
        </div>
    </div>
    
</body>
</html>
